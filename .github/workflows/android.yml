name: Android APK (Godot)

on:
  push:
    paths:
      - "godot/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  PROJECT_PATH: godot

jobs:
  android:
    name: Build debug APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install export templates and editor settings
        shell: bash
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot
          if [ -d /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ] && [ ! -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/
          fi
          SDK="${ANDROID_HOME:-/usr/lib/android-sdk}"
          JDK="${JAVA_HOME:-$(dirname "$(dirname "$(readlink -f "$(which java)")")")}"
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" -deststoretype pkcs12
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
            {
              echo '[gd_resource type="EditorSettings" format=3]'
              echo ''
              echo '[resource]'
              echo "export/android/android_sdk_path = \"$SDK\""
              echo "export/android/java_sdk_path = \"$JDK\""
              echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
              echo 'export/android/debug_keystore_user = "androiddebugkey"'
              echo 'export/android/debug_keystore_pass = "android"'
            } > ~/.config/godot/$f
          done
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import project
        shell: bash
        run: |
          cd "$PROJECT_PATH"
          godot --headless --import || true

      - name: Export APK
        shell: bash
        run: |
          cd "$PROJECT_PATH"
          mkdir -p build
          godot --headless --export-debug "Android" build/BLOODRITE-debug.apk
          ls -la build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BLOODRITE-android-debug
          path: godot/build/BLOODRITE-debug.apk
          if-no-files-found: error
