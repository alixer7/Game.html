<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BLOODRITE · طقوس الدم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;800;900&family=Cairo:wght@400;600;800;900&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--blood:#8a0303;--blood2:#d0141b;--gold:#c9a45c;--bone:#e8dcc4;--ink:#070304}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--bone);font-family:'Cairo',system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#bloodScreen{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#ui{position:fixed;inset:0;pointer-events:none;direction:ltr}
.hide{display:none!important}
.logo{font-family:'Cinzel Decorative',serif;font-weight:900;font-size:clamp(46px,10vw,132px);letter-spacing:.05em;line-height:1;background:linear-gradient(180deg,#ff5a43 0%,#b0000f 48%,#3b0006 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 22px rgba(255,10,30,.45)) drop-shadow(0 6px 2px #000)}
.sub{font-family:'Reem Kufi',sans-serif;font-size:clamp(18px,3vw,34px);color:var(--gold);letter-spacing:.25em;text-shadow:0 0 14px #000,0 2px 2px #000;margin-top:6px}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1d0505 0%,#000 70%);z-index:60;pointer-events:auto}
.lbar{width:min(420px,70vw);height:5px;background:#200;margin-top:34px;border:1px solid #5a1a10}
.lbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#600,#ff2a1a);box-shadow:0 0 12px #f00;transition:width .2s}
.ltxt{margin-top:12px;font-size:14px;color:#a88;letter-spacing:.1em;direction:rtl}
/* ---------- HUD ---------- */
#hud{position:absolute;inset:0}
.hpw{position:absolute;top:max(16px,env(safe-area-inset-top));width:40%;height:28px}
.hpw.p1{left:3%}.hpw.p2{right:3%}
.hpf{position:absolute;inset:0;background:linear-gradient(#1b0405,#080102);border:2px solid #7a6440;box-shadow:0 0 0 2px #000,0 6px 18px rgba(0,0,0,.85),inset 0 0 12px #000;overflow:hidden}
.p1 .hpf{transform:skewX(-16deg)}.p2 .hpf{transform:skewX(16deg)}
.hpf .tr,.hpf .fl{position:absolute;top:0;bottom:0;width:100%}
.p1 .hpf .tr,.p1 .hpf .fl{left:0}.p2 .hpf .tr,.p2 .hpf .fl{right:0}
.hpf .tr{background:linear-gradient(#fff2c0,#d8b060)}
.hpf .fl{background:linear-gradient(180deg,#ff7a55 0%,#d8141c 38%,#6e040c 100%)}
.hpf .fl::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 45%)}
.hpf.poison .fl{background:linear-gradient(180deg,#b8ff7a 0%,#45a812 40%,#163f06 100%)}
.hpf.low .fl{animation:lowhp .45s infinite alternate}
@keyframes lowhp{to{filter:brightness(1.6) saturate(1.3)}}
.nm{position:absolute;top:34px;font-family:'Cinzel',serif;font-weight:900;font-size:clamp(13px,1.7vw,22px);letter-spacing:.14em;color:var(--bone);text-shadow:0 2px 3px #000,0 0 10px #000;white-space:nowrap}
.p1 .nm{left:8px}.p2 .nm{right:8px}
.wins{position:absolute;top:37px;display:flex;gap:6px}
.p1 .wins{right:6px}.p2 .wins{left:6px}
.wins i{width:17px;height:17px;transform:rotate(45deg);border:2px solid #7a6440;background:#120203;box-shadow:0 0 6px #000}
.wins i.on{background:radial-gradient(circle,#ff4a30,#6a0000);box-shadow:0 0 12px #f20}
#timer{position:absolute;top:max(6px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:84px;height:62px;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-weight:900;font-size:40px;color:var(--bone);text-shadow:0 0 12px #f00,0 3px 2px #000;background:radial-gradient(circle,#330707 0%,#0a0101 72%);border:2px solid #7a6440;clip-path:polygon(16% 0,84% 0,100% 50%,84% 100%,16% 100%,0 50%)}
.mtr{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));width:32%;display:flex;gap:5px;align-items:center}
.mtr.p1{left:3%}.mtr.p2{right:3%;flex-direction:row-reverse}
.mtr .sg{flex:1;height:13px;background:#160405;border:1px solid #6b4a2a;position:relative;overflow:hidden;transform:skewX(-22deg);box-shadow:0 0 0 1px #000}
.mtr .sg i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(180deg,#ffd27a,#ff3a00 45%,#7a0000)}
.mtr .sg.f i{box-shadow:0 0 10px #ff4000}
.mtr .lb{font-family:'Cinzel',serif;font-weight:900;font-size:12px;color:var(--gold);margin:0 8px;letter-spacing:.18em;text-shadow:0 0 6px #000}
.mtr.full .sg{animation:mfull .35s infinite alternate}
.mtr.full .lb{color:#ff5030;text-shadow:0 0 10px #f00}
@keyframes mfull{to{box-shadow:0 0 16px #ff3000,0 0 0 1px #ff8040}}
.combo{position:absolute;top:27%;font-family:'Cinzel',serif;font-weight:900;opacity:0;transition:opacity .25s,transform .25s;transform:scale(.8)}
.combo.on{opacity:1;transform:scale(1)}
.combo.p1{left:3.5%}.combo.p2{right:3.5%;text-align:right}
.combo .h{font-size:clamp(28px,4.6vw,62px);color:#fff;text-shadow:0 0 16px #f00,0 4px 2px #000;line-height:1}
.combo .h small{font-size:.45em;color:#ffb0a0;margin-left:6px;letter-spacing:.1em}
.combo .d{font-size:clamp(15px,2vw,26px);color:#ff5a40;text-shadow:0 2px 2px #000}
.tag{position:absolute;top:43%;font-family:'Cinzel',serif;font-weight:900;font-size:clamp(16px,2.2vw,30px);letter-spacing:.18em;color:#ffd080;text-shadow:0 0 12px #f40,0 3px 2px #000;opacity:0;transition:opacity .2s}
.tag.p1{left:3.5%}.tag.p2{right:3.5%}
.tag.on{opacity:1;animation:tagpop .3s}
@keyframes tagpop{from{transform:scale(1.6)}to{transform:scale(1)}}
#announce{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;text-align:center}
#announce .big{font-family:'Cinzel Decorative',serif;font-weight:900;font-size:clamp(46px,10.5vw,150px);line-height:1;background:linear-gradient(180deg,#ffe6c8 0%,#ff4a2a 35%,#9a0010 70%,#2a0004 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 26px rgba(255,0,0,.55)) drop-shadow(0 8px 3px #000);animation:annIn .5s cubic-bezier(.2,1.6,.4,1)}
#announce .big.bone{background:linear-gradient(180deg,#fff 0%,#e8dcc4 45%,#8a7a5a 100%);-webkit-background-clip:text;background-clip:text}
#announce .small{font-family:'Reem Kufi',sans-serif;font-size:clamp(18px,3vw,38px);color:var(--gold);letter-spacing:.2em;text-shadow:0 0 12px #000,0 3px 2px #000;margin-top:4px;animation:annIn .6s}
#announce .hint{font-family:'Cairo',sans-serif;font-size:clamp(14px,1.8vw,22px);color:#fff;background:rgba(40,0,0,.6);border:1px solid #7a2020;padding:6px 18px;margin-top:18px;direction:rtl;animation:annIn .6s}
@keyframes annIn{from{transform:scale(2.4);opacity:0;filter:blur(8px)}to{transform:scale(1);opacity:1}}
#announce.out .big,#announce.out .small,#announce.out .hint{transition:opacity .35s,transform .35s;opacity:0;transform:scale(.85)}
#superName{position:absolute;left:0;right:0;top:62%;text-align:center;font-family:'Cinzel Decorative',serif;font-weight:900;font-size:clamp(24px,4.5vw,60px);color:#ffcf9a;text-shadow:0 0 22px #f20,0 4px 3px #000;opacity:0;letter-spacing:.08em}
#superName.on{animation:sname 1.6s forwards}
@keyframes sname{0%{opacity:0;transform:translateX(-30%) skewX(-20deg)}12%{opacity:1;transform:translateX(0) skewX(-8deg)}80%{opacity:1;transform:translateX(3%) skewX(-8deg)}100%{opacity:0;transform:translateX(30%) skewX(-20deg)}}
#train{position:absolute;left:12px;top:110px;font-size:13px;line-height:1.55;background:rgba(10,0,0,.62);border:1px solid #5a2a1a;padding:8px 12px;color:#eedcc0;direction:rtl;min-width:220px}
#train b{color:#ffb070}
#inputLog{position:absolute;left:12px;bottom:60px;font-family:'Cinzel',serif;font-size:14px;color:#fff;text-shadow:0 1px 2px #000;line-height:1.3}
/* ---------- MENUS ---------- */
#menu{position:absolute;inset:0;pointer-events:auto;direction:rtl}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,rgba(30,0,0,.25),rgba(0,0,0,.78) 75%)}
.screen.clear{background:radial-gradient(ellipse at 50% 30%,rgba(0,0,0,0) 30%,rgba(0,0,0,.7) 90%)}
.mlist{display:flex;flex-direction:column;gap:10px;margin-top:34px;min-width:min(360px,80vw)}
.mbtn{font-family:'Reem Kufi',sans-serif;font-size:clamp(18px,2.4vw,26px);color:var(--bone);background:linear-gradient(90deg,rgba(60,0,0,0),rgba(70,4,4,.65),rgba(60,0,0,0));border:none;border-top:1px solid rgba(201,164,92,.25);border-bottom:1px solid rgba(201,164,92,.25);padding:10px 30px;cursor:pointer;letter-spacing:.06em;transition:all .15s;text-shadow:0 2px 2px #000;position:relative}
.mbtn small{display:block;font-family:'Cinzel',serif;font-size:.5em;letter-spacing:.3em;color:#a08a60}
.mbtn.sel,.mbtn:hover{color:#fff;background:linear-gradient(90deg,rgba(120,0,0,0),rgba(170,10,10,.85),rgba(120,0,0,0));text-shadow:0 0 12px #f00,0 2px 2px #000;transform:scale(1.05)}
.mbtn.sel::before,.mbtn.sel::after{content:'✦';position:absolute;top:50%;transform:translateY(-50%);color:#ff4a30;font-size:.7em}
.mbtn.sel::before{right:8px}.mbtn.sel::after{left:8px}
.press{margin-top:48px;font-family:'Reem Kufi';font-size:clamp(16px,2.2vw,26px);color:#fff;letter-spacing:.2em;animation:blink 1.2s infinite;text-shadow:0 0 10px #f00}
@keyframes blink{50%{opacity:.25}}
.foot{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:13px;color:#a08a70;letter-spacing:.05em}
/* char select */
#cs{justify-content:flex-end;padding-bottom:max(30px,env(safe-area-inset-bottom))}
#cs .ttl{position:absolute;top:max(14px,env(safe-area-inset-top));font-family:'Reem Kufi';font-size:clamp(20px,3vw,40px);color:var(--gold);letter-spacing:.2em;text-shadow:0 0 16px #000,0 2px 2px #000}
.grid{display:flex;gap:clamp(6px,1.2vw,16px);direction:ltr}
.card{width:clamp(64px,10vw,140px);aspect-ratio:3/4;border:2px solid #4a3a26;background:#0b0303 center/cover no-repeat;position:relative;cursor:pointer;box-shadow:0 8px 20px #000;transition:transform .15s,border-color .15s;filter:saturate(.75) brightness(.8)}
.card .cn{position:absolute;bottom:0;left:0;right:0;text-align:center;font-family:'Cinzel',serif;font-weight:900;font-size:clamp(9px,1.1vw,14px);background:linear-gradient(transparent,#000);padding:14px 2px 4px;letter-spacing:.1em}
.card.c1{border-color:#ff2a1a;transform:translateY(-8px) scale(1.06);filter:none;box-shadow:0 0 22px rgba(255,30,20,.6),0 8px 20px #000}
.card.c2{border-color:#3aa0ff;transform:translateY(-8px) scale(1.06);filter:none;box-shadow:0 0 22px rgba(40,140,255,.6),0 8px 20px #000}
.card.c1.c2{border-color:#c070ff}
.card .who{position:absolute;top:4px;font-family:'Cinzel';font-weight:900;font-size:12px;padding:1px 6px}
.card .who.a{left:4px;background:#c00;color:#fff}.card .who.b{right:4px;background:#1a6ad0;color:#fff}
.info{position:absolute;top:18%;width:min(30vw,380px);direction:rtl;text-shadow:0 2px 3px #000}
.info.l{left:2.5%;text-align:left;direction:ltr}.info.r{right:2.5%;text-align:right}
.info .n{font-family:'Cinzel Decorative';font-weight:900;font-size:clamp(22px,3.6vw,52px);line-height:1;color:#fff;text-shadow:0 0 18px #f00,0 3px 3px #000}
.info .t{font-family:'Reem Kufi';font-size:clamp(13px,1.6vw,20px);color:var(--gold);margin:6px 0 8px}
.info .d{font-size:clamp(11px,1.15vw,15px);color:#ddd;direction:rtl;text-align:right;line-height:1.6;background:rgba(0,0,0,.45);padding:6px 10px;border-right:2px solid #8a1010}
.stat{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:12px;direction:rtl}
.stat span{width:58px;color:#bba}.stat i{flex:1;height:6px;background:#200;position:relative}.stat i b{position:absolute;right:0;top:0;bottom:0;background:linear-gradient(90deg,#ff4020,#700)}
.diff{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap;justify-content:center}
.panel{background:rgba(8,2,2,.92);border:1px solid #5a3a22;box-shadow:0 0 40px #000;padding:18px 22px;max-width:min(1100px,94vw);max-height:84vh;overflow:auto;direction:rtl;pointer-events:auto}
.panel h2{font-family:'Reem Kufi';color:var(--gold);margin:4px 0 12px;font-size:26px;letter-spacing:.1em}
.panel h3{font-family:'Reem Kufi';color:#ff6a50;margin:16px 0 6px;font-size:19px;border-bottom:1px solid #4a2010;padding-bottom:4px}
table.mv{width:100%;border-collapse:collapse;font-size:13.5px}
table.mv th{color:#c9a45c;font-weight:800;text-align:right;padding:5px 6px;border-bottom:1px solid #3a2010;white-space:nowrap}
table.mv td{padding:5px 6px;border-bottom:1px solid #1e0c08;vertical-align:top}
table.mv td.in{font-family:'Cinzel',serif;font-weight:800;direction:ltr;text-align:right;white-space:nowrap;color:#fff}
table.mv td.pro{color:#9fe08a}table.mv td.con{color:#ff9a8a}
table.mv tr:hover td{background:rgba(120,0,0,.18)}
.lv{font-size:11px;padding:1px 6px;border:1px solid;white-space:nowrap}
.lv.high{color:#ffd070}.lv.mid{color:#ff8a50}.lv.low{color:#70c0ff}.lv.overhead{color:#ff60d0}.lv.throw{color:#c0c0c0}.lv.unblockable{color:#ff3030}.lv.proj{color:#ffb0b0}
.kb{display:inline-block;min-width:22px;padding:0 5px;border:1px solid #8a6a40;background:#1a0a04;border-radius:3px;font-family:'Cinzel';font-weight:900;font-size:12px;color:#fff;text-align:center;margin:0 1px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tab{padding:6px 14px;border:1px solid #5a3a22;cursor:pointer;font-family:'Cinzel';font-weight:900;font-size:13px;background:#120404}
.tab.on{background:#7a0a0a;color:#fff}
.close{position:sticky;top:0;float:left;cursor:pointer;font-size:22px;color:#f66;background:#200;border:1px solid #600;width:34px;height:34px;display:flex;align-items:center;justify-content:center;z-index:2}
.ctl{display:grid;grid-template-columns:auto auto auto;gap:6px 22px;font-size:15px;align-items:center}
.ctl div:nth-child(3n+1){color:var(--gold)}
/* touch */
#touch{position:absolute;inset:0;pointer-events:none}
#touch .pad{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(80,0,0,.35),rgba(20,0,0,.15));border:2px solid rgba(201,164,92,.35);pointer-events:auto}
#touch .pad i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:rgba(200,40,30,.5);border:2px solid rgba(255,200,150,.5)}
#touch .btns{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,58px);gap:8px;pointer-events:auto;direction:ltr}
#touch .tb{height:58px;border-radius:50%;background:rgba(40,4,4,.55);border:2px solid rgba(201,164,92,.5);color:#fff;font-family:'Cinzel';font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1}
#touch .tb small{font-family:'Cairo';font-size:9px;color:#dcb}
#touch .tb.on{background:rgba(200,30,20,.75)}
#touch .tb.sp{background:rgba(120,30,0,.6);border-color:#ff7030}
#touch .pause{position:absolute;top:max(84px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:40px;height:30px;pointer-events:auto;background:rgba(30,0,0,.6);border:1px solid #7a6440;color:#fff;display:flex;align-items:center;justify-content:center}
@media (max-width:700px){.info{top:12%;width:44vw}.info .d{display:none}.hpw{height:20px;width:41%}.nm{top:25px;font-size:11px}.wins{top:26px}.wins i{width:11px;height:11px}#timer{width:58px;height:44px;font-size:26px}.mtr{width:38%}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="bloodScreen"></canvas>
<div id="ui">
  <div id="loading"><div class="logo">BLOODRITE</div><div class="sub">طقوس الدم</div><div class="lbar"><i></i></div><div class="ltxt">يتم استحضار الأرواح...</div></div>
  <div id="hud" class="hide">
    <div class="hpw p1"><div class="hpf"><div class="tr"></div><div class="fl"></div></div><div class="nm"></div><div class="wins"><i></i><i></i></div></div>
    <div class="hpw p2"><div class="hpf"><div class="tr"></div><div class="fl"></div></div><div class="nm"></div><div class="wins"><i></i><i></i></div></div>
    <div id="timer">99</div>
    <div class="mtr p1"><div class="sg"><i></i></div><div class="sg"><i></i></div><div class="sg"><i></i></div><div class="lb">WRATH</div></div>
    <div class="mtr p2"><div class="sg"><i></i></div><div class="sg"><i></i></div><div class="sg"><i></i></div><div class="lb">WRATH</div></div>
    <div class="combo p1"><div class="h"></div><div class="d"></div></div>
    <div class="combo p2"><div class="h"></div><div class="d"></div></div>
    <div class="tag p1"></div><div class="tag p2"></div>
    <div id="train" class="hide"></div>
    <div id="inputLog"></div>
  </div>
  <div id="superName"></div>
  <div id="announce"></div>
  <div id="menu"></div>
  <div id="touch" class="hide">
    <div class="pad"><i></i></div>
    <div class="btns">
      <div class="tb" data-b="1">1<small>لكمة</small></div><div class="tb" data-b="2">2<small>لكمة ثقيلة</small></div><div class="tb" data-b="BL">BL<small>صد</small></div><div class="tb sp" data-b="SP">✦<small>غضب</small></div>
      <div class="tb" data-b="3">3<small>ركلة</small></div><div class="tb" data-b="4">4<small>ركلة ثقيلة</small></div><div class="tb" data-b="TH">TH<small>مسكة</small></div><div class="tb" data-b="ESC">II<small>إيقاف</small></div>
    </div>
  </div>
</div>
<script type="importmap">

</script>
<script type="module">
// =====================================================================
//  BLOODRITE — original 3D dark-fantasy fighting game (single file)
// =====================================================================
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const V3 = THREE.Vector3, Q4 = THREE.Quaternion, M4 = THREE.Matrix4, C3 = THREE.Color;
const PI = Math.PI, TAU = PI * 2;
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = a => a[(Math.random() * a.length) | 0];
const EASE = {
  lin: t => t,
  out: t => 1 - (1 - t) * (1 - t) * (1 - t),
  snap: t => 1 - Math.pow(1 - t, 5),
  in: t => t * t * t,
  in2: t => t * t,

function setupTouch() {
  const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0; if (!isTouch) return;
  const T = $('#touch'), pad = T.querySelector('.pad'), knob = pad.querySelector('i');
  const obs = new MutationObserver(() => T.classList.toggle('hide', $('#hud').classList.contains('hide'))); obs.observe($('#hud'), { attributes: true });
  let pid = null;
  const upd = e => { const r = pad.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2; let dx = (e.clientX - cx) / (r.width / 2), dy = (e.clientY - cy) / (r.height / 2); const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; } knob.style.transform = `translate(${dx * 40}px,${dy * 40}px)`; TOUCH.L = dx < -.38; TOUCH.R = dx > .38; TOUCH.U = dy < -.45; TOUCH.D = dy > .45; };
  pad.addEventListener('pointerdown', e => { AUDIO.init(); pid = e.pointerId; pad.setPointerCapture(pid); upd(e); });
  pad.addEventListener('pointermove', e => { if (e.pointerId === pid) upd(e); });
  const rel = e => { if (e.pointerId !== pid) return; pid = null; knob.style.transform = ''; TOUCH.L = TOUCH.R = TOUCH.U = TOUCH.D = false; };
  pad.addEventListener('pointerup', rel); pad.addEventListener('pointercancel', rel);
  T.querySelectorAll('.tb').forEach(b => {
    const k = b.dataset.b;
    b.addEventListener('pointerdown', e => { e.preventDefault(); AUDIO.init(); if (k === 'ESC') { togglePause(); return; } TOUCH[k] = true; b.classList.add('on'); });
    const up = () => { TOUCH[k] = false; b.classList.remove('on'); };
    b.addEventListener('pointerup', up); b.addEventListener('pointerleave', up); b.addEventListener('pointercancel', up);
  });
}
